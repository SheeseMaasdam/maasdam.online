name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Сборки нет: сайт — обычные статичные файлы.
      # Находим папку с index.html (корень или подпапка, например site/)
      # и собираем в _site только нужные файлы — без .DS_Store, deploy.yaml и т.п.
      - name: Prepare site files
        run: |
          INDEX=$(find . -name index.html -not -path './.git/*' -not -path './_site/*' -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$INDEX" ]; then
            echo "::error::index.html не найден в репозитории"
            exit 1
          fi
          SRC=$(dirname "$INDEX")
          echo "Папка сайта: $SRC"
          mkdir _site
          cp "$SRC/index.html" "$SRC/style.css" "$SRC/script.js" _site/
          cp -r "$SRC/assets" _site/assets
          find _site -name '.DS_Store' -delete

      - name: Deploy to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "_site/*"
          target: "/var/www/astro-site"
          strip_components: 1
          rm_target: true
          overwrite: true
