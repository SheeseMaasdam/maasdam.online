# Автоматический деплой сайта maasdam.online на GitHub Pages.
# Срабатывает при каждом push в ветку main (и вручную — кнопка "Run workflow" во вкладке Actions).
# Сборки нет: сайт статический, поэтому в публикацию просто копируются нужные файлы.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, нужные для публикации на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только один деплой; новый заменяет ожидающий, а уже идущий не прерывается
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site files
        # Копируем только то, что нужно сайту (без .git, .DS_Store, __MACOSX и т.п.)
        run: |
          mkdir _site
          cp site/index.html site/style.css _site/
          cp -r site/scripts _site/scripts
          cp -r site/assets _site/assets
          find _site -name '.DS_Store' -delete

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
