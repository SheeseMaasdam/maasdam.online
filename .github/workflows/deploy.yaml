# Автоматический деплой сайта maasdam.online на GitHub Pages.
# Срабатывает при каждом push в ветку main (и вручную — кнопка "Run workflow" во вкладке Actions).
# Сборки нет: сайт статический, поэтому в публикацию просто копируются нужные файлы.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, нужные для публикации на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только один деплой; новый заменяет ожидающий, а уже идущий не прерывается
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site files
        # Ищем папку, где лежит index.html (корень репозитория или подпапка, например site/),
        # и копируем только нужные сайту файлы (без .git, .DS_Store, __MACOSX и т.п.)
        run: |
          INDEX=$(find . -name index.html -not -path './.git/*' -not -path './_site/*' -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$INDEX" ]; then
            echo "::error::index.html не найден в репозитории"
            exit 1
          fi
          SRC=$(dirname "$INDEX")
          echo "Папка сайта: $SRC"
          mkdir _site
          cp "$SRC/index.html" "$SRC/style.css" "$SRC/script.js" _site/
          cp -r "$SRC/assets" _site/assets
          find _site -name '.DS_Store' -delete

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
