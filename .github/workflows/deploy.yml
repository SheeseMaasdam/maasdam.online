name: Deploy Astro Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем Node.js в окружении GitHub
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # <-- Исправлено здесь
          cache: 'npm'
          cache-dependency-path: 'astro-blog/package-lock.json'

      # 3. Устанавливаем зависимости и собираем проект
      - name: Install dependencies & Build
        run: |
          cd astro-blog
          npm ci
          npm run build

      # 4. Полная очистка папки на VDS и копирование новых файлов
      - name: Deploy to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "astro-blog/dist/*"
          target: "/var/www/astro-site"
          strip_components: 2 
          rm_target: true
          overwrite: true
