name: Deploy site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Сборка больше не нужна: сайт — обычные статичные файлы из папки site/
      - name: Deploy to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "site/*"
          target: "/var/www/astro-site"
          strip_components: 1
          rm_target: true
          overwrite: true
